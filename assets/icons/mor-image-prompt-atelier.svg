<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img"
     aria-label="Mor Image Prompt Atelier">
  <defs>
    <!-- Deep atelier night -->
    <linearGradient id="tile" x1="12" y1="8" x2="116" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#14141f"/>
      <stop offset="55%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#06060a"/>
    </linearGradient>
    <!-- Mor accent rim -->
    <linearGradient id="rim" x1="20" y1="18" x2="108" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d4c4ff"/>
      <stop offset="45%" stop-color="#b89cff"/>
      <stop offset="100%" stop-color="#6e54b8"/>
    </linearGradient>
    <!-- Paper / prompt surface -->
    <linearGradient id="paper" x1="36" y1="32" x2="92" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f7f3ea"/>
      <stop offset="100%" stop-color="#cfc7b6"/>
    </linearGradient>
    <!-- Generated scene -->
    <linearGradient id="hills" x1="40" y1="52" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c9b3ff"/>
      <stop offset="100%" stop-color="#4a3a86"/>
    </linearGradient>
    <linearGradient id="sky" x1="40" y1="40" x2="88" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2a2248"/>
      <stop offset="100%" stop-color="#12101c"/>
    </linearGradient>
    <radialGradient id="glow" cx="64" cy="58" r="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b89cff" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#b89cff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#b89cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nib" x1="90" y1="28" x2="108" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0ece2"/>
      <stop offset="100%" stop-color="#b89cff"/>
    </linearGradient>
    <!-- Soft clip for inner art -->
    <clipPath id="mat">
      <rect x="40" y="38" width="48" height="48" rx="5"/>
    </clipPath>
  </defs>

  <!-- Squircle app tile -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#tile)"/>
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#glow)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="28" fill="none"
        stroke="url(#rim)" stroke-width="2.25" stroke-opacity="0.55"/>
  <rect x="11" y="11" width="106" height="106" rx="26" fill="none"
        stroke="#f0ece2" stroke-opacity="0.10" stroke-width="1.25"/>

  <!-- Ornate picture frame (atelier print) -->
  <rect x="30" y="28" width="68" height="68" rx="12" fill="none"
        stroke="url(#rim)" stroke-width="5"/>
  <rect x="36" y="34" width="56" height="56" rx="8" fill="url(#paper)"/>
  <rect x="40" y="38" width="48" height="48" rx="5" fill="url(#sky)"/>

  <!-- Generated image: night scene + hills + lamp -->
  <g clip-path="url(#mat)">
    <path d="M40 70 C48 62 54 58 64 60 C74 62 80 56 88 52 L88 86 L40 86 Z" fill="url(#hills)"/>
    <path d="M40 78 C50 72 58 74 66 76 C76 78 82 72 88 70 L88 86 L40 86 Z"
          fill="#3a2f6e" opacity="0.85"/>
    <!-- Lamp / moon -->
    <circle cx="76" cy="48" r="6" fill="#e0a13a"/>
    <circle cx="76" cy="48" r="9" fill="#e0a13a" opacity="0.22"/>
    <!-- Stipple dots (PC-98 DNA) -->
    <g fill="#f0ece2" opacity="0.28">
      <circle cx="46" cy="46" r="1.1"/>
      <circle cx="52" cy="44" r="0.9"/>
      <circle cx="49" cy="50" r="0.8"/>
      <circle cx="58" cy="47" r="1"/>
      <circle cx="55" cy="52" r="0.7"/>
    </g>
  </g>

  <!-- Prompt lines under mat (readable at small sizes as bars) -->
  <g stroke="#101018" stroke-opacity="0.38" stroke-width="2.4" stroke-linecap="round">
    <line x1="44" y1="102" x2="78" y2="102"/>
    <line x1="44" y1="108" x2="68" y2="108"/>
  </g>
  <!-- Accent underline (craft mark) -->
  <line x1="44" y1="102" x2="58" y2="102" stroke="#b89cff" stroke-width="2.4"
        stroke-linecap="round" opacity="0.85"/>

  <!-- Quill / pen: prompt craft -->
  <g transform="translate(2, -2)">
    <!-- shaft -->
    <path d="M90 46 L108 26" stroke="#f0ece2" stroke-width="3.6" stroke-linecap="round"/>
    <!-- barb -->
    <path d="M90 46 L97.5 53.5" stroke="#b89cff" stroke-width="3.2" stroke-linecap="round"/>
    <!-- feather body -->
    <path d="M105 22
             C111.5 19.5 118 26 114.5 32.5
             L98.5 52.5
             C96.5 55 92.5 54.5 91 52
             L88 49
             C86.2 47.2 86.4 43.8 88.8 42.2 Z"
          fill="url(#nib)"/>
    <!-- feather split -->
    <path d="M95 48 L108 32" stroke="#6e54b8" stroke-width="1.4" stroke-linecap="round"
          opacity="0.65"/>
    <!-- tip ink -->
    <path d="M89 54 L85 59" stroke="#7d64c9" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- Sparkles (generation) -->
  <g fill="#f0ece2">
    <path d="M22 38 l1.8 4.2 4.2 1.8 -4.2 1.8 -1.8 4.2 -1.8 -4.2 -4.2 -1.8 4.2 -1.8 z"
          opacity="0.95"/>
    <path d="M104 86 l1.3 3.1 3.1 1.3 -3.1 1.3 -1.3 3.1 -1.3 -3.1 -3.1 -1.3 3.1 -1.3 z"
          opacity="0.7"/>
    <circle cx="24" cy="92" r="2" opacity="0.45"/>
    <circle cx="108" cy="40" r="1.5" opacity="0.4"/>
  </g>
</svg>
