<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Mor Image Prompt Atelier">
  <defs>
    <linearGradient id="bg" x1="16" y1="6" x2="112" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161622"/>
      <stop offset="50%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#08080c"/>
    </linearGradient>
    <linearGradient id="frame" x1="28" y1="26" x2="100" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d0c0ff"/>
      <stop offset="55%" stop-color="#b89cff"/>
      <stop offset="100%" stop-color="#7d64c9"/>
    </linearGradient>
    <linearGradient id="paper" x1="38" y1="34" x2="90" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5f1e8"/>
      <stop offset="100%" stop-color="#d4cdbf"/>
    </linearGradient>
    <linearGradient id="scene" x1="42" y1="48" x2="86" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c9b3ff"/>
      <stop offset="100%" stop-color="#5f4aa8"/>
    </linearGradient>
    <radialGradient id="glow" cx="64" cy="56" r="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b89cff" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#b89cff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#b89cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- App tile -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#glow)"/>
  <rect x="10" y="10" width="108" height="108" rx="26" fill="none"
        stroke="#f0ece2" stroke-opacity="0.14" stroke-width="1.75"/>

  <!-- Picture frame -->
  <rect x="30" y="28" width="68" height="72" rx="11" fill="none" stroke="url(#frame)" stroke-width="4"/>
  <rect x="37" y="35" width="54" height="58" rx="6" fill="url(#paper)"/>

  <!-- Abstract landscape / generated image -->
  <path d="M41 82 L52 60 L61 70 L71 50 L87 82 Z" fill="url(#scene)"/>
  <circle cx="74" cy="48" r="5.5" fill="#e0a13a"/>

  <!-- Prompt text lines -->
  <g stroke="#101018" stroke-opacity="0.32" stroke-width="2.1" stroke-linecap="round">
    <line x1="43" y1="86.5" x2="73" y2="86.5"/>
    <line x1="43" y1="91.5" x2="64" y2="91.5"/>
  </g>

  <!-- Quill (prompt craft) -->
  <path d="M88 42 L105 24" stroke="#f0ece2" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M88 42 L95 49" stroke="#b89cff" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M102 20.5 C107.5 18.5 113 24 110.5 29.5 L96 48 C94.3 50.2 91 50 89.5 48 L86.5 45
           C85 43.5 85 40.5 87 39 Z" fill="#c9b3ff"/>
  <path d="M91.5 47.5 L87 52" stroke="#7d64c9" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Sparkles -->
  <g fill="#f0ece2">
    <path d="M23 42 l1.7 4 4 1.7 -4 1.7 -1.7 4 -1.7 -4 -4 -1.7 4 -1.7 z" opacity="0.92"/>
    <path d="M103 80 l1.25 3 3 1.25 -3 1.25 -1.25 3 -1.25 -3 -3 -1.25 3 -1.25 z" opacity="0.72"/>
    <circle cx="27" cy="88" r="1.9" opacity="0.5"/>
  </g>
</svg>
